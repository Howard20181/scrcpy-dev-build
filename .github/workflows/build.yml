name: Build scrcpy

on:
  push:
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        description: "scrcpy branch to build"
        required: true
        default: "dev"
        options:
          - dev
          - master

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      scrcpy_commit: ${{ steps.commit.outputs.commit }}
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Resolve branch
        id: branch
        run: |
          BRANCH="${{ github.event.inputs.branch || 'dev' }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Get scrcpy commit
        id: commit
        run: |
          COMMIT=$(git ls-remote https://github.com/Genymobile/scrcpy.git "${{ steps.branch.outputs.branch }}" | cut -f1)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Generate version string
        id: version
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_COMMIT="${{ steps.commit.outputs.commit }}"
          SHORT_COMMIT="${SHORT_COMMIT:0:7}"
          VERSION="${{ steps.branch.outputs.branch }}-$DATE-$SHORT_COMMIT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-server:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout scrcpy
        uses: actions/checkout@v7
        with:
          repository: Genymobile/scrcpy
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build server
        run: release/build_server.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server
          path: release/work/build-server/server/scrcpy-server

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            deps: linux
            command: release/build_linux.sh x86_64
          - name: win32
            runner: ubuntu-latest
            deps: mingw
            command: release/build_windows.sh 32
          - name: win64
            runner: ubuntu-latest
            deps: mingw
            command: release/build_windows.sh 64
          - name: macos-aarch64
            runner: macos-latest
            deps: macos
            arch: arm64
            deployment_target: "10.13"
            command: release/build_macos.sh aarch64
          - name: macos-x86_64
            runner: macos-26-intel
            deps: macos
            arch: x86_64
            deployment_target: "10.13"
            command: release/build_macos.sh x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check architecture
        if: matrix.arch
        run: |
          arch=$(uname -m)
          if [[ "$arch" != "${{ matrix.arch }}" ]]; then
            echo "Unexpected architecture: $arch" >&2
            exit 1
          fi

      - name: Checkout scrcpy
        uses: actions/checkout@v7
        with:
          repository: Genymobile/scrcpy
          ref: ${{ needs.prepare.outputs.branch }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ matrix.name }}
          restore-keys: ${{ matrix.name }}
          create-symlink: true
          variant: "sccache"

      - name: Install dependencies (Linux)
        if: matrix.deps == 'linux'
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm ffmpeg libavcodec-dev \
             libavdevice-dev libavformat-dev libavutil-dev libswresample-dev \
             libusb-1.0-0 libusb-1.0-0-dev libv4l-dev \
             libasound2-dev libpulse-dev \
             libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
             libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
             libxkbcommon-dev libdrm-dev libva-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
             libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
             libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Install dependencies (MinGW)
        if: matrix.deps == 'mingw'
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm \
             mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Install dependencies (macOS)
        if: matrix.deps == 'macos'
        run: |
          brew trust aws/tap
          brew install meson nasm libiconv zlib automake autoconf libtool

      # meson only prepends sccache to compilers it auto-detects, and CMake and
      # FFmpeg's configure never do. Wrap every compiler name instead, and name
      # the wrapper explicitly so meson does not wrap it a second time.
      - name: Route the compilers through sccache
        if: matrix.deps != 'mingw'
        run: |
          sccache_bin="$(command -v sccache)"
          for tool in cc gcc g++ c++; do
            printf '#!/bin/sh\nexec %s /usr/bin/%s "$@"\n' "$sccache_bin" "$tool" \
              | sudo tee "/usr/local/bin/$tool" > /dev/null
            sudo chmod +x "/usr/local/bin/$tool"
          done
          if [[ "$(command -v cc)" != /usr/local/bin/cc ]]; then
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          fi

      # The cross file names the compilers, so they only reach sccache through
      # a wrapper on PATH.
      - name: Route the cross compilers through sccache
        if: matrix.deps == 'mingw'
        run: |
          sccache_bin="$(command -v sccache)"
          for host in i686-w64-mingw32 x86_64-w64-mingw32; do
            for tool in gcc g++; do
              printf '#!/bin/sh\nexec %s /usr/bin/%s-%s "$@"\n' \
                "$sccache_bin" "$host" "$tool" | sudo tee "/usr/local/bin/$host-$tool" > /dev/null
              sudo chmod +x "/usr/local/bin/$host-$tool"
            done
          done

      - name: Build
        if: matrix.deps != 'mingw'
        env:
          CC: /usr/local/bin/cc
          CXX: /usr/local/bin/c++
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: ${{ matrix.command }}

      - name: Build (cross-compiled)
        if: matrix.deps == 'mingw'
        run: ${{ matrix.command }}

      - name: Tar
        run: |
          cd "release/work/build-${{ matrix.name }}"
          mkdir -p dist-tar
          cd dist-tar
          tar -C .. -cvf "${{ matrix.name }}-intermediate.tar.gz" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: release/work/build-${{ matrix.name }}/dist-tar/${{ matrix.name }}-intermediate.tar.gz
          archive: false

  release:
    needs:
      - prepare
      - build
      - build-server
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout scrcpy
        uses: actions/checkout@v7
        with:
          repository: Genymobile/scrcpy
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Download scrcpy-server
        uses: actions/download-artifact@v8
        with:
          name: scrcpy-server
          path: release/work/build-server/server/

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-intermediate.tar.gz"
          path: ${{ runner.temp }}/artifacts

      - name: Unpack build artifacts
        run: |
          for archive in "$RUNNER_TEMP"/artifacts/*/*.tar.gz; do
            name="$(basename "$archive" -intermediate.tar.gz)"
            mkdir -p "release/work/build-$name"
            tar xf "$archive" -C "release/work/build-$name"
          done

      - name: Package server
        run: release/package_server.sh

      - name: Package clients
        run: |
          for target in linux-x86_64:tar.gz win32:zip win64:zip macos-aarch64:tar.gz macos-x86_64:tar.gz; do
            release/package_client.sh "${target%%:*}" "${target##*:}"
          done

      - name: Zip server
        run: |
          zip -j release/output/scrcpy-server-${{ needs.prepare.outputs.version }}.zip release/work/build-server/server/scrcpy-server
          rm release/output/scrcpy-server-$VERSION

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRCPY_COMMIT: ${{ needs.prepare.outputs.scrcpy_commit }}
          SCRCPY_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          printf 'Automated dev build of [scrcpy](https://github.com/Genymobile/scrcpy) from the `%s` branch.\n\n**Commit**: [`%s`](https://github.com/Genymobile/scrcpy/commit/%s)\n' \
            "$SCRCPY_BRANCH" "${SCRCPY_COMMIT:0:7}" "$SCRCPY_COMMIT" > /tmp/release-notes.md
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "scrcpy $VERSION" \
              --notes-file /tmp/release-notes.md
            gh release upload "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              release/output/*
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "scrcpy $VERSION" \
              --notes-file /tmp/release-notes.md \
              release/output/*
          fi
